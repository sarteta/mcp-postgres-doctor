name: docker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-postgres-doctor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run compose stack and verify safety check + tools register
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from doctor

      - name: Show image size
        if: always()
        run: docker images mcp-postgres-doctor:ci --format "size: {{.Size}}"

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io/sarteta/mcp-postgres-doctor:latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcp-postgres-doctor:latest
            ghcr.io/${{ github.repository_owner }}/mcp-postgres-doctor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
