name: docker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mcp-postgres-doctor:ci .

      - name: Show image size
        run: docker images mcp-postgres-doctor:ci

      - name: Run compose stack (verifies safety check + tool registration)
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from doctor

      - name: Compose logs (debug on failure)
        if: failure()
        run: docker compose logs

  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcp-postgres-doctor:latest
            ghcr.io/${{ github.repository_owner }}/mcp-postgres-doctor:${{ github.sha }}
